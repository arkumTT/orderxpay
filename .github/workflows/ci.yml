name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: src/api/go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
      - run: go test ./...

  back-office:
    name: Back Office (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/back-office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/back-office/package-lock.json
      - run: npm ci
      - run: npm run lint
      # next build runs its own TypeScript check as part of the build, using
      # the route types it generates along the way — a standalone
      # `tsc --noEmit` before this point fails on PageProps/LayoutProps
      # (ambient types Next.js hasn't generated yet).
      - run: npm run build

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
